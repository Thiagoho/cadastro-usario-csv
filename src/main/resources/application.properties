
# ============================================
# ARQUIVO: application.properties
#
# RESPONSABILIDADE:
# Configurar o funcionamento da aplicação
# Cadastro de Usuários.
#
# CONFIGURAÇÕES:
# 1. Nome da aplicação.
# 2. Porta do servidor.
# 3. Conexão com o MySQL.
# 4. Persistência com JPA/Hibernate.
# 5. Renderização de páginas Thymeleaf.
# ============================================


# ============================================
# 1. CONFIGURAÇÕES DA APLICAÇÃO
# ============================================

# Define o nome da aplicação Spring Boot.
spring.application.name=cadastro-usuarios

# Define a porta HTTP utilizada pelo servidor.
#
# A aplicação poderá ser acessada em:
# http://localhost:8080/usuarios
server.port=8080


# ============================================
# 2. CONEXÃO COM O BANCO DE DADOS MYSQL
# ============================================

# Define o endereço JDBC do banco MySQL.
#
# ${SPRING_DATASOURCE_URL:...}
#
# Se existir a variável de ambiente
# SPRING_DATASOURCE_URL, seu valor será usado.
#
# Caso contrário, será utilizado o endereço
# padrão localhost:3308.
#
# localhost:3308:
# Conexão quando a aplicação roda no computador
# e o MySQL está publicado pelo Docker.
#
# cadastro_usuarios:
# Nome do banco de dados.
#
# allowPublicKeyRetrieval=true:
# Permite a recuperação da chave pública
# em determinados métodos de autenticação.
#
# useSSL=false:
# Desabilita SSL na conexão JDBC.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/cadastro_usuarios?allowPublicKeyRetrieval=true&useSSL=false}

# Usuário padrão para conexão com o MySQL.
spring.datasource.username=root

# Senha padrão de acesso ao banco.
spring.datasource.password=SuaSenhaForte123

# Define o driver JDBC utilizado na conexão.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================
# 3. CONFIGURAÇÕES JPA / HIBERNATE
# ============================================

# Permite ao Hibernate atualizar o esquema
# do banco com base nas entidades JPA.
#
# update:
# Tenta ajustar a estrutura existente
# sem recriar todas as tabelas do zero.
#
# ATENÇÃO:
# Não substitui um controle de migrações.
spring.jpa.hibernate.ddl-auto=update

# Exibe as instruções SQL geradas pelo
# Hibernate durante a execução.
spring.jpa.show-sql=true

# Formata o SQL exibido para facilitar
# a leitura durante o desenvolvimento.
spring.jpa.properties.hibernate.format_sql=true


# ============================================
# 4. CONFIGURAÇÕES DO THYMELEAF
# ============================================

# Desabilita o cache dos templates HTML.
#
# Facilita o desenvolvimento porque permite
# visualizar alterações nas páginas sem
# utilizar o cache dos templates.
spring.thymeleaf.cache=false
